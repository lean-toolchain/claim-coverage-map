# ccm.yaml — put at the root of your Lean repository
paper: arXiv:2609.08431        # or a LaTeX directory in this repo, e.g. paper/

main_results: ["Theorem 1.1"]  # optional: which results are the paper's main claims
links:                         # optional: explicit correspondence (otherwise docstrings / search)
  "Theorem 3.1": ["Foo.main_theorem"]
  "Lemma 4.4": []              # intentionally not formalized
ignore: ["Proposition 2.3"]    # e.g. results cited from other papers

llm:                           # optional: overridden by CLI flags / action inputs
  provider: claude-code        # locally: your logged-in Claude subscription
  model: claude-opus-5-5
  votes: 2
